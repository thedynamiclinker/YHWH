<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' blob: file: https://fukkot.com; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>YHWH</title>
  <link rel="icon" href="../assets/ld.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/brand.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="verse-source.css">
  <link rel="stylesheet" href="../../var/tmp/yhwh/default/ui/renderer.css">
</head>
<body class="theme-dark">
  <header class="titlebar">
    <button class="brand" data-command="about" title="About YHWH"><span class="ld-mark" aria-hidden="true"></span><span>YHWH</span></button>
    <span class="window-title">Toward a pro-human AI apocalypse.</span>
    <div class="personality"><label for="energy">YHWH-ness</label><input id="energy" type="range" min="0" max="4" value="3" aria-label="YHWH-ness"><button id="mode-name" data-command="modes">Genesis</button></div>
    <button id="upgrade-button" class="edition-glyph" data-command="upgrade" title="Upgrade to YHWH Pro!" aria-label="Upgrade to YHWH Pro!">曰</button>
    <button data-command="inbox" title="Inbox" aria-label="Inbox">Inbox<span id="inbox-count"></span></button><button data-command="help" title="Keyboard shortcuts (F1)" aria-label="Keyboard shortcuts">⌨</button>
  </header>
  <div class="tab-strip"><nav id="tabs" aria-label="App tabs"></nav><button data-command="new-tab" title="New tab (Ctrl+T)" aria-label="New tab">＋</button><button class="quiet" data-command="palette" title="Command palette (Ctrl+P)">:</button></div>
  <div class="workspace workspace-split mod-root" id="workspace">
    <nav class="ribbon side-dock-ribbon" aria-label="Tools">
      <button data-command="toggle-files" title="File manager (Ctrl+Shift+E)" aria-label="Toggle file manager">▤</button>
      <button data-command="open-file" title="Open file (Ctrl+O)" aria-label="Open file">⌕</button>
      <button data-command="toggle-terminal" title="Terminal (Ctrl+B)" aria-label="Toggle terminal">›_</button>
      <button data-command="palette" title="Command palette (Ctrl+P)" aria-label="Command palette">:</button>
      <button data-command="margins" title="In the margins" aria-label="In the margins">≡</button>
      <button data-command="inbox" title="Inbox" aria-label="Open Inbox">✉</button>
      <button data-command="focus-document" title="Document" aria-label="Focus document">▱</button>
      <div class="ribbon-spacer"></div>
      <button data-command="chat" title="Talk to YHWH" aria-label="Talk to YHWH">𐤉</button>
      <button data-command="settings" title="Settings (Ctrl+,)" aria-label="Settings">☷</button>
    </nav>
    <div id="navigation-area" class="navigation-area">
      <section id="files" class="file-manager workspace-leaf" aria-label="File manager">
        <header class="pane-header"><span>Files</span><div><button data-command="new-file" data-file-icon="newFile" title="New file (Ctrl+N)" aria-label="New file"></button><button data-command="new-directory" data-file-icon="newFolder" title="New directory" aria-label="New directory"></button><button data-command="expand-files" data-file-icon="maximize" title="Expand file manager (Ctrl+D)" aria-label="Expand file manager"></button></div></header>
        <div class="universe-tools"><button data-command="un" title="un · Universe commands" aria-label="un · Universe commands" aria-haspopup="menu"><span data-file-icon="newUniverse"></span>un ▾</button></div>
        <div class="navigation-buttons"><button data-command="back" data-file-icon="back" title="Back (Alt+Left)" aria-label="Back"></button><button data-command="forward" data-file-icon="forward" title="Forward (Alt+Right)" aria-label="Forward"></button></div>
        <form id="location-form"><input id="location" aria-label="Current directory" spellcheck="false"></form>
        <div class="file-filter"><input id="file-filter" placeholder="Filter files…" aria-label="Filter files"><button data-command="toggle-hidden" data-file-icon="hidden" title="Show hidden files (Ctrl+H)" aria-label="Show hidden files"></button></div>
        <div class="directory-shortcuts" role="group" aria-label="Shell directories">
          <button type="button" data-command="home" aria-label="Go to home directory"><span aria-hidden="true">~</span><small dir="auto"></small></button>
          <button type="button" data-command="anchor-directory" aria-label="Go to tab prefix"><span aria-hidden="true">@</span><small dir="auto"></small></button>
          <button type="button" data-command="root-directory" aria-label="Go to root directory"><span aria-hidden="true">/</span><small dir="auto"></small></button>
          <button type="button" class="directory-more" data-command="directory-actions" title="Shell directory actions" aria-label="Shell directory actions" aria-haspopup="true" aria-expanded="false">…</button>
        </div>
        <div id="file-list" role="listbox" tabindex="0" aria-label="Directory contents"></div>
        <footer class="directory-footer"><span id="file-count"></span><button data-command="refresh" data-file-icon="refresh" title="Refresh" aria-label="Refresh directory"></button></footer>
        <div id="directory-menu" class="directory-menu" popover="auto" role="menu" aria-label="Directory actions"></div>
      </section>
      <div class="resize-handle sidebar-resize" role="separator" aria-label="Resize file manager"></div>
    </div>
    <main class="focus-area workspace-split" id="focus-area">
      <div id="center-panels" class="center-panels">
        <section class="document workspace-leaf" id="document" aria-label="Document">
          <header class="document-toolbar"><span id="document-path"></span><div><button data-command="reload-file" title="Reload from disk" aria-label="Reload file">↻</button><button id="view-mode" data-command="choose-view-mode" title="Choose view (Ctrl+E source, Ctrl+R reading)">Source</button><button data-command="file-menu" title="File actions" aria-label="File actions">…</button></div></header>
          <div class="document-title" id="title-row" hidden><input id="file-title" aria-label="Filename" spellcheck="false"><span id="dirty-indicator"></span><button data-command="save" title="Save (Ctrl+S)" aria-label="Save file">Save</button></div>
          <div id="documents"></div>

        </section>
        <section id="margin-box" class="margin-box" aria-label="In the margins" hidden></section>
        <section id="inbox-view" class="inbox-view" aria-label="Inbox" hidden>
          <header class="pane-header">
            <button type="button" class="inbox-home" data-command="focus-document"><span aria-hidden="true">←</span> Back to workspace</button>
            <span>Inbox <small id="mail-unread"></small></span>
            <button type="button" data-mail-settings aria-label="Mail settings" title="Mail settings">⚙</button>
          </header>
          <div id="mail-content"></div>
        </section>
      </div>
      <section id="terminal-panel" class="terminal-panel workspace-leaf" aria-label="Terminal" hidden>
        <div class="resize-handle terminal-resize" role="separator" aria-label="Resize terminal"></div>
        <header class="pane-header"><span><button data-command="terminal-interface" aria-label="Choose terminal interface">Terminal ▾</button> <small id="terminal-cwd"></small></span><div><span class="sync-label" id="shell-state">↔ Files</span><button data-command="terminal-bottom" title="Dock terminal below document">Dock below</button><button data-command="expand-terminal" title="Expand terminal (Ctrl+Shift+B)" aria-label="Expand terminal">⛶</button><button data-command="toggle-terminal" title="Hide terminal" aria-label="Hide terminal">×</button></div></header>
        <div id="terminals"></div><div id="terminal-initial" hidden></div>
      </section>
    </main>
    <aside id="right-panels" class="right-panels"></aside>
  </div>
  <footer class="statusbar status-bar"><button id="divine-footnote" data-command="edit-footer"></button><span class="status-spacer"></span><div id="merch-shortcut"></div><button class="quiet-support" data-command="seed-funding">Seed funding</button><button id="higher-help" data-command="higher-help">Need Some Help?</button><button data-command="focus-editor" id="cursor-position">Ready</button><span id="file-encoding"></span><div id="language-controls" hidden><select id="language-picker" aria-label="Syntax highlighting language"><option value="auto">Auto</option></select><button id="language-why" data-command="language-why" hidden>Why?</button></div></footer>
  <dialog id="dialog"></dialog><div id="toast" role="status" aria-live="polite"></div>
  <style id="user-theme"></style>
  <script type="module" src="../../var/tmp/yhwh/default/ui/renderer.js"></script>
</body>
</html>
